name: Tests
on:
- push
- pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Installs the uv environment and trains METL
  train:
    name: Test METL training
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Disabled testing on Windows because there were too many Windows-specific PyTorch training issues
        # Re-enable and debug these if there is user demand for Windows
        os:
        - macos-latest
        - ubuntu-latest
        # - windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      with:
        version: "0.13.5"
        enable-cache: true
    - name: Install locked environment
      run: uv sync --frozen
      # Pretrain source model on GFP Rosetta dataset
    - name: Pretrain source METL model
      run: uv run python code/train_source_model.py @args/pretrain_avgfp_local.txt --max_epochs 5 --limit_train_batches 5 --limit_val_batches 5 --limit_test_batches 5
      # Finetune target model on GFP DMS dataset
    - name: Finetune target METL model
      run: uv run python code/train_target_model.py @args/finetune_avgfp_local.txt --enable_progress_bar false --enable_simple_progress_messages --max_epochs 50 --unfreeze_backbone_at_epoch 25
      # Load target model checkpoint and run inference on example variants
    - name: Load and test target METL model
      # Log directory name is different on every run
      run: |
        cp=output/training_logs/*/checkpoints/epoch=49-step=50.ckpt
        uv run python code/convert_ckpt.py --ckpt_path $cp
        cp=output/training_logs/*/checkpoints/*.pt
        uv run python code/tests.py --ckpt_path $cp --variants E3K,G102S_T36P,S203T,K207R_V10A,D19G,F25S,E113V --dataset avgfp
